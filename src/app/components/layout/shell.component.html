<app-loading />
<ngx-sonner-toaster [position]="'top-right'" [duration]="4000" [richColors]="true" [closeButton]="true" />
<div class="shell" [class.open]="menuAberto" [class.collapsed]="menuRecolhido">
  <div class="scrim" (click)="menuAberto = false"></div>
  <aside class="nav"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" class="wa-icon" width="26" height="26"><path fill="currentColor" d="M20.52 3.48A11.74 11.74 0 0 0 12.05 0C5.5 0 .19 5.3.19 11.85c0 2.09.55 4.13 1.59 5.92L0 24l6.4-1.68a11.85 11.85 0 0 0 5.65 1.45h.01c6.55 0 11.86-5.3 11.86-11.85 0-3.16-1.23-6.14-3.4-8.44z" /></svg></span><div class="brand-text"><strong>Disparo</strong><small>WhatsApp</small></div></div>
    <p class="group">Enviar</p><nav (click)="menuAberto = false"><a routerLink="/enviar" routerLinkActive="active" title="Enviar"><span class="material-symbols-outlined">chat</span><span class="lbl">Enviar</span></a><a routerLink="/massa" routerLinkActive="active" title="Enviar em Massa"><span class="material-symbols-outlined">upload_file</span><span class="lbl">Enviar em Massa</span></a></nav>
    <p class="group">Preparar</p><nav (click)="menuAberto = false"><a routerLink="/templates" routerLinkActive="active" title="Templates"><span class="material-symbols-outlined">notes</span><span class="lbl">Templates</span></a><a routerLink="/usuarios" routerLinkActive="active" title="Usuários"><span class="material-symbols-outlined">group</span><span class="lbl">Usuários</span></a><a routerLink="/whatsapp" routerLinkActive="active" title="WhatsApp"><span class="material-symbols-outlined">qr_code_2</span><span class="lbl">WhatsApp</span></a><a routerLink="/historico" routerLinkActive="active" title="Histórico"><span class="material-symbols-outlined">history</span><span class="lbl">Histórico</span></a></nav>
    <div class="nav-foot"><small class="email-lbl">{{ autenticacao.email() }}</small><button mat-button class="sair" (click)="autenticacao.sair()" title="Sair"><span class="material-symbols-outlined">logout</span><span class="lbl">Sair</span></button></div>
  </aside><div class="main"><header class="top"><button mat-icon-button class="menu mobile" type="button" (click)="menuAberto = !menuAberto" aria-label="Menu"><span class="material-symbols-outlined">menu</span></button><button mat-icon-button class="menu collapse" type="button" (click)="alternarMenu()" [attr.aria-label]="menuRecolhido ? 'Expandir menu' : 'Recolher menu'"><span class="material-symbols-outlined">{{ menuRecolhido ? 'menu_open' : 'chevron_left' }}</span></button><div class="status" [class]="classeStatus()"><span class="bulb"></span><div><b>WhatsApp {{ rotuloStatus() }}</b>@if (numerosConectados()) {<small>{{ numerosConectados() }}</small>}</div></div><app-whatsapp-status-badge /></header><section class="content"><router-outlet /></section></div>
</div>
